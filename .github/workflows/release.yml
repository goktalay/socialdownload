# Windows exe'lerini derler.
# - "v1.2.3" gibi bir etiket gönderilince: sürümü etiketten alır, derler, GitHub Release'e ekler ve mastertool.download'a yükler.
# - Actions sekmesinden elle çalıştırılınca (workflow_dispatch): yalnızca derler, exe'leri "artifact" olarak saklar.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sürümü etiketten al
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - run: npm test

      # Motor: yt-dlp (imzalı SHA2-256SUMS + sabit sha256) ve FFmpeg LGPL (sabit sha256) — scripts/engine-manifest.json
      - name: Motoru indir ve doğrula
        run: node scripts/fetch-engine.js win64
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Exe'leri derle
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: Social-Download-windows
          path: dist/*.exe
          retention-days: 14

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

      # Exe kullanıcılara Hesabım ve Master Tool üzerinden dağıtılır (mastertool.download, uygulama kodu "sd").
      # Anahtar depo secret'ı SOCIALDOWNLOAD_RELEASE_KEY (ya da kısa adı SD_RELEASE_KEY); tanımlı değilse adım atlanır.
      # Sunucu tarafında aynı değer .env'de SOCIALDOWNLOAD_RELEASE_KEY olarak durur.
      # Kurulum ve portable ayrı isteklerle parçalı gönderilir: sunucunun önündeki Cloudflare tek istekte en çok
      # 100 MB kabul ediyor. Ayrıntılar scripts/upload-socialdownload.sh.
      - name: mastertool.download'a yükle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          SOCIALDOWNLOAD_RELEASE_KEY: ${{ secrets.SOCIALDOWNLOAD_RELEASE_KEY || secrets.SD_RELEASE_KEY }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          bash scripts/upload-socialdownload.sh "$V" "dist/Social-Download-Setup-$V.exe" "$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")" "dist/Social-Download-Portable-$V.exe"
